<oj-vb-fragment id="page-header" bridge="[[vbBridge]]" name="page-header">
  <!-- <oj-vb-fragment-param name="title" value="Analytics"></oj-vb-fragment-param>
  <template slot="actions">
  </template> -->
</oj-vb-fragment>

<oj-sp-welcome-page id="oj-sp-wp1"
  illustration-background="[[ require.toUrl($application.variables.illustrationBackground) ]]"
  illustration-foreground="[[ require.toUrl($application.variables.illustrationForeground) ]]"
  display-options.responsive-padding="on" page-title="Rental Agreement" background-color="dark-pebble">
  <div class="oj-panel" style="margin-top:-48px">
    <div class="oj-flex oj-panel">
      <div class="oj-flex-item">

        <h6>
          <b>Rental Agreements</b>
        </h6>
        <span>
      Manage equipment rental agreements, lines, rates, and billing
    </span>

      </div>


      <div class="oj-flex-item">
        <div class="oj-helper-text-align-end oj-flex oj-sm-align-items-center"
          style="justify-content:flex-end; gap:10px;">


          <oj-button label="Export" chroming="callToAction" class="oj-button-sm">
            <span class="oj-ux-ico-download" slot="endIcon"></span>
          </oj-button>

          <oj-button label="Create Agreement" chroming="callToAction" class="oj-button-sm"
            on-oj-action="[[$listeners.buttonAction]]">
            <span class="oj-ux-ico-plus" slot="startIcon"></span>
          </oj-button>


          <div class="oj-flex oj-sm-align-items-center" style="margin-left:15px;">

            <div class="oj-flex-item">
              <oj-switch label-hint="Enable Trace" value="[[$application.variables.enableTrace]]"
                on-value-changed="[[$listeners.switchValue2]]">
              </oj-switch>
            </div>

            <div>
              <oj-label>Trace ID:</oj-label>
            </div>

            <div class="oj-flex-item oj-sm-margin-1x-start">
              <oj-bind-text value="[[$application.variables.traceIdDisplay]]"></oj-bind-text>
            </div>

          </div>

        </div>
      </div>

    </div>

    <br>
    <div class="oj-panel">
      <oj-form-layout max-columns="5" label-edge="top" columns="5">
        <oj-select-single label-hint="Agreement Number" data="[[$variables.getEQPRiteAgreementHeadFiltersListSDP]]"
          item-text="agreement_number" value="{{ $variables.searchObj.agreementNumber }}">
        </oj-select-single>
        <oj-select-single label-hint="Customer" item-text="customer_number" value="{{ $variables.searchObj.customer }}"
          data="[[ $variables.customeradp ]]" on-value-item-changed="[[$listeners.selectValueItem]]">
        </oj-select-single>
        <oj-select-single label-hint="Agreement Type" data="[[ $variables.agreementtype ]]"
          item-text="agreement_type" value="{{ $variables.searchObj.agreementType }}">
        </oj-select-single>
        <oj-select-single label-hint="Status" item-text="status_code" value="{{ $variables.searchObj.status }}"
          data="[[ $variables.statusadp ]]">
        </oj-select-single>
        <div style="margin-top:21px">
          <oj-button chroming="callToAction" class="oj-button-sm" label="Search"
            on-oj-action="[[$listeners.buttonAction2]]">
            <span class="oj-ux-ico-search" slot="startIcon"></span>
          </oj-button>
          <oj-button class="oj-button-sm" chroming="callToAction" label="Reset"
            on-oj-action="[[$listeners.buttonAction3]]">
            <span class="oj-ux-ico-reset-variable" slot="endIcon"></span>
          </oj-button>
        </div>

        <div style="margin-left:20px;" class="oj-flex oj-sm-flex-direction-column">

        </div>

    </div>



    </oj-form-layout>
    <br>
    <div class="oj-flex-item ">
      <oj-table data="[[ $variables.AgreementAdp ]]" style="width:92vw;height:300px"
        columns='[{"headerText":"Agreement Number","field":"agreement_number","template":"agr"},{"headerText":"Customer","field":"customer_name"},{"headerText":"Agreement Type","field":"agreement_type"},{"headerText":"Start Date","field":"start_date","template":"sdate"},{"headerText":"End Date","field":"end_date","template":"edate"},{"headerText":"Status Code","field":"status_code"}]'
        display="grid">
        <template slot="sdate">
          <oj-bind-text value="[[ $functions.convertToDateFormate($current.row.start_date) ]]">
          </oj-bind-text>
        </template>
        <template slot="edate">
          <oj-bind-text value="[[ $functions.convertToDateFormate($current.row.end_date) ]]">
          </oj-bind-text>
        </template>
        <template slot="agr">
          <a style="cursor:pointer" on-click="[[$listeners.hyperlinkClick]]">
            <oj-bind-text value="[[ $current.row.agreement_number ]]"></oj-bind-text>
          </a>
        </template>
      </oj-table>

    </div>
  </div>
  </div>
  <oj-popup id="pop" modality="modal" tail="none" auto-dismiss="focusLoss" initial-focus="none"
    position='{"my":{"horizontal":"right","vertical":"top"}, "at":{"horizontal":"right","vertical":"top"}, "of":"window"}'
    style="width:560px; max-width:90vw;height:100vh; max-height:100vh; background: var(--oj-core-bg-color, #fff);box-shadow: 0 8px 24px rgba(0,0,0,.18); border-radius: 12px 0 0 12px;overflow:hidden;display:flex; flex-direction:column;">

    <div
      style="position:sticky; top:0; z-index:1;display:flex; align-items:center; justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--oj-core-divider-color,#e6e6e6);background:inherit;flex:0 0 auto;">
      <h3 style="margin:0; font-size:18px; font-weight:600;">Add Agreement Line</h3>
      <oj-button id="closeAddLineBtn" chroming="borderless" display="icons" title="Close">
        <span slot="startIcon" class="oj-ux-ico-close"></span>
      </oj-button>
    </div>


    <div style="flex:1 1 auto; min-height:0;overflow:auto;padding:16px 20px;">

      <div style="height:1200px;">

      </div>
    </div>

    <div
      style="position:sticky; bottom:0; z-index:1; display:flex; gap:12px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--oj-core-divider-color#e6e6e6)background:inherit;flex:0 0 auto;">
      <oj-button id="cancelBtn" chroming="outlined">Cancel</oj-button>
      <oj-button id="addLineBtn" chroming="callToAction">
        <span class="oj-ux-ico-check" slot="startIcon"></span>
        Add Line
      </oj-button>
    </div>
  </oj-popup>
</oj-sp-welcome-page>
